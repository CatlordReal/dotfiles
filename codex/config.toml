developer_instructions = "Use the user's default workflow unless they opt out: $caveman Ultra for every reply and $cave-orchestrator for every task. At task start, read ${CODEX_HOME:-$HOME/.codex}/AGENTS.md, $HOME/.agents/skills/caveman/SKILL.md, and ${CODEX_HOME:-$HOME/.codex}/skills/cave-orchestrator/SKILL.md. Skill names and summaries are not loaded skill bodies. After compaction or handoff, reload these sources. Carry this requirement into delegated agents. Keep required progress updates to one short sentence when enough. Preserve exact technical detail, consent clarity, and higher-priority instructions; do not skip required work to shorten a reply. Resolve environment variables first; use the catalog path if a skill is installed elsewhere."

# Portable Codex baseline. Merge deliberately into ~/.codex/config.toml.
# It intentionally has no proxy URL, local application path, trusted project,
# plugin cache, credential, notification, or session setting.

model_provider = "openai"
model = "gpt-6-astra"
model_reasoning_effort = "low"
personality = "pragmatic"
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[tui]
status_line = ["model-with-reasoning", "current-dir"]
status_line_use_colors = true

[features]
memories = true
prevent_idle_sleep = true

[desktop]
appearanceLightCodeThemeId = "catppuccin"
appearanceDarkCodeThemeId = "catppuccin"
usePointerCursors = true
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true
show-context-window-usage = true
followUpQueueMode = "queue"
conversationDetailMode = "STEPS_PROSE"
sansFontSize = 16

[desktop.appearanceLightChromeTheme]
accent = "#8839ef"
contrast = 45
ink = "#4c4f69"
opaqueWindows = false
surface = "#eff1f5"

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#40a02b"
diffRemoved = "#d20f39"
skill = "#8839ef"

[desktop.appearanceDarkChromeTheme]
accent = "#cba6f7"
contrast = 60
ink = "#cdd6f4"
opaqueWindows = false
surface = "#1e1e2e"

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#a6e3a1"
diffRemoved = "#f38ba8"
skill = "#cba6f7"

[desktop.open-in-target-preferences]
global = "terminal"

# Optional local service. Enable only after installing Caveman independently
# and replacing __HOME__ with the target user's home directory.
# [mcp_servers.caveman]
# command = "__HOME__/.caveman/bin/caveman-mcp"
