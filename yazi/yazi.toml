[manager]
ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = true
show_symlink = true
scrolloff = 8

[preview]
tab_size = 2
max_width = 1600
max_height = 1600
cache_dir = ""

[opener]
edit = [
  { run = 'nvim "$@"', block = true, for = "unix" },
]
open = [
  { run = 'xdg-open "$@"', desc = "Open", for = "linux" },
  { run = 'open "$@"', desc = "Open", for = "macos" },
]
reveal = [
  { run = 'xdg-open "$(dirname "$1")"', desc = "Reveal", for = "linux" },
  { run = 'open -R "$1"', desc = "Reveal", for = "macos" },
]

[open]
prepend_rules = [
  { mime = "text/*", use = [ "edit", "open", "reveal" ] },
  { mime = "application/json", use = [ "edit", "open", "reveal" ] },
  { mime = "application/x-yaml", use = [ "edit", "open", "reveal" ] },
]
